<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overview · Inventory</title>
<script>
  // Theme before first paint; same key and rule as the Planner's header.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('app.theme'); } catch (e) { /* storage blocked */ }
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/planner.css">
</head>
<body>
<!--
  overview.html — Inventory → Overview (#81 part 1): the item catalog, with
  its stocking status, threshold and note edited in the row. On hand,
  Incoming and Reorder arrive with part 2.

  Glue, NOT UNIT-TESTED: the table and its cells need a browser, and this
  repo has no DOM harness. Every route it calls is tested in
  test/inventory.test.js. The layout, filters, sorting and the family
  filter's saved choice are checked by hand (#81, Testing Decisions).
-->
<header class="appbar">
  <div class="appbar-primary">
    <span class="appbar-brand">Inventory</span>
    <button type="button" class="themebtn" id="theme-btn" aria-label="Switch between light and dark">☾</button>
    <span class="appbar-user" id="user-name"></span>
    <button type="button" class="ghost appbar-signout" id="sign-out">Sign out</button>
  </div>
  <nav class="appbar-nav" aria-label="Modes"><a href="/">Planner</a><a href="/inventory" class="here" aria-current="page">Inventory</a><a href="/settings/users">Settings</a><a href="/activity">Activity Log</a></nav>
  <nav class="appbar-nav appbar-tasks" aria-label="Tasks"><a href="/inventory" class="here" aria-current="page">Overview</a></nav>
</header>

<div class="wrap wide">
  <div id="message" role="status"></div>

  <div class="row" style="align-items:flex-end">
    <label class="field">Family <select id="family"><option value="">All families</option></select></label>
    <label class="field">Search <input id="search" type="search" autocomplete="off" placeholder="SKU, size, grade, note…"></label>
    <div class="field">Show <span id="show-status" class="row" style="gap:8px;flex-wrap:nowrap"></span></div>
    <label style="padding-bottom:8px"><input type="checkbox" id="show-retired"> Show retired</label>
    <button type="button" id="add-open">+ Add item</button>
  </div>

  <form id="add" class="row" hidden>
    <label class="field">Family <select id="add-family"></select></label>
    <span id="add-fields" style="display:contents"></span>
    <button id="add-btn">Add</button>
    <button type="button" class="ghost" id="add-cancel">Cancel</button>
  </form>

  <form id="rename" class="row" hidden>
    <span class="field">Rename <b id="rename-from"></b></span>
    <span id="rename-fields" style="display:contents"></span>
    <button>Save name</button>
    <button type="button" class="ghost" id="rename-cancel">Cancel</button>
  </form>

  <div id="tabs" class="row" style="gap:8px;margin:10px 0" hidden></div>

  <div class="tw"><table class="one-line catalog">
    <colgroup id="cols"></colgroup>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <p class="sub" id="count"></p>
  <p class="sub">A blank threshold is "not set"; 0 means "reorder when none are left". LVL thresholds are set per depth, in linear feet, in Settings → LVL thresholds. Only an admin can rename an item.</p>
</div>

<script src="/app-header.js"></script>
<script src="/planner-ui.js"></script>
<script>
(async () => {
  const { esc } = PlannerUI;
  const { send, say, itemLabel } = AppHeader;
  const el = (id) => document.getElementById(id);
  const me = await AppHeader.me;
  if (!me) return;

  const STATUSES = ['Stocked', 'Non-Stock', 'Special Order'];
  // What each identity field is called on screen, per family where it differs.
  const FIELD_LABELS = { sku: 'SKU', product: 'Product', size: 'Size', grade: 'Grade', length_ft: 'Length (ft)' };
  const LVL_LABELS = { size: 'Depth' };
  const fieldLabel = (family, field) => (family === 'lvl' && LVL_LABELS[field]) || FIELD_LABELS[field];
  const FAMILY_KEY = 'inventory.family';
  const TAB_KEY = 'inventory.tab.';   // + family: the size or depth tab last open

  let families = [];
  let items = [];
  let gradeOrder = [];
  const shown = new Set(STATUSES);
  let sort = null;      // { col, dir } a person chose; null is the family's own order
  let tab = null;       // the open size (lumber) or depth (LVL) tab
  let renaming = null;  // the item the rename form is for

  const familyName = (code) => (families.find((f) => f.code === code) || { name: code }).name;
  const family = () => el('family').value;

  // Text with numbers in it compared as numbers, so 2x6 comes before 2x10
  // and 9-1/2 before 11-7/8.
  const byText = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
  // A lumber grade's place in the engine's strength order, weakest first;
  // a grade the engine does not know goes last.
  const gradeRank = (g) => { const r = gradeOrder.indexOf(g); return r === -1 ? gradeOrder.length : r; };

  // The columns for the family chosen, each with its width, its header, how
  // its cell reads and how it sorts. Lumber and LVL tabs pick the size or
  // depth, so neither repeats it in a column.
  const COL = {
    family: { head: 'Family', width: 10, sort: (i) => familyName(i.family), cell: (i) => esc(familyName(i.family)) },
    item: { head: 'Item', width: 30, sort: (i) => itemLabel(i), cell: (i) => esc(itemLabel(i)), name: true },
    sku: { head: 'SKU', width: 30, sort: (i) => i.sku, cell: (i) => esc(i.sku), name: true },
    product: { head: 'Product', width: 26, sort: (i) => i.product, cell: (i) => esc(i.product), name: true },
    grade: { head: 'Grade', width: 14, sort: (i) => gradeRank(i.grade), cell: (i) => esc(i.grade), name: true },
    length: { head: 'Length', width: 10, sort: (i) => i.length_ft, cell: (i) => i.length_ft + '′', name: true },
    stocking: {
      head: 'Stocking', width: 16, sort: (i) => i.stocking,
      cell: (i) => '<select data-field="stocking" aria-label="Stocking status">' +
        STATUSES.map((s) => '<option' + (s === i.stocking ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select>',
    },
    threshold: {
      head: 'Threshold', width: 11, sort: (i) => i.threshold,
      cell: (i) => (i.family === 'lvl' ? '<span class="sub">per depth</span>'
        : '<input data-field="threshold" type="number" min="0" step="1" style="width:6em" aria-label="Threshold" value="' + (i.threshold ?? '') + '">'),
    },
    note: { head: 'Note', width: 22, cell: (i) => '<input data-field="note" aria-label="Note" value="' + esc(i.note || '') + '">' },
    actions: {
      head: '', width: 14,
      cell: (i) => (me.admin ? '<button type="button" class="ghost" data-do="rename">Rename</button>' : '') +
        '<button type="button" class="ghost" data-do="' + (i.active ? 'retire' : 'unretire') + '">' + (i.active ? 'Retire' : 'Un-retire') + '</button>',
    },
  };
  // Per family: its columns, its tab field (if any), and its own order when
  // nobody has clicked a header. Lumber: weakest grade first, then shortest.
  const VIEWS = {
    '': { cols: ['family', 'item', 'stocking', 'threshold', 'note', 'actions'], order: ['family', 'item'] },
    plates: { cols: ['sku', 'stocking', 'threshold', 'note', 'actions'], order: ['sku'] },
    hangers: { cols: ['sku', 'stocking', 'threshold', 'note', 'actions'], order: ['sku'] },
    lumber: { tab: 'size', cols: ['grade', 'length', 'stocking', 'threshold', 'note', 'actions'], order: ['grade', 'length'] },
    lvl: { tab: 'size', cols: ['product', 'length', 'stocking', 'note', 'actions'], order: ['product', 'length'] },
  };
  // A search looks across every size or depth, so the rows then name their
  // item in full instead of leaving the size to the tab.
  const view = () => {
    const v = VIEWS[family()] || VIEWS[''];
    if (!v.tab || !el('search').value.trim()) return v;
    return { cols: ['item'].concat(v.cols.filter((c) => !COL[c].name)), order: ['item'] };
  };

  async function load() {
    const body = await fetch('/api/items').then((r) => r.json()).catch(() => ({ ok: false, error: 'The catalog did not load. Reload the page to try again.' }));
    if (!body.ok) return say(body.error, 'bad');
    ({ families, items, gradeOrder } = body);
    paintFilters();
    paint();
  }

  function paintFilters() {
    let saved = '';
    try { saved = localStorage.getItem(FAMILY_KEY) || ''; } catch { /* storage blocked */ }
    const opts = families.map((f) => '<option value="' + esc(f.code) + '">' + esc(f.name) + '</option>').join('');
    el('family').innerHTML = '<option value="">All families</option>' + opts;
    el('family').value = families.some((f) => f.code === saved) ? saved : '';
    el('add-family').innerHTML = opts;
    paintStatus();
  }
  function paintStatus() {
    el('show-status').innerHTML = STATUSES.map((s) =>
      '<button type="button" class="' + (shown.has(s) ? '' : 'ghost') + '" data-status="' + esc(s) + '" aria-pressed="' + shown.has(s) + '">' + esc(s) + '</button>').join('');
  }

  // The size or depth tabs, for lumber and LVL: one per value the family's
  // items have, in numeric order. The tab last open on this computer opens again.
  function paintTabs() {
    const v = view();
    el('tabs').hidden = !v.tab;
    if (!v.tab) { tab = null; return; }
    const values = [...new Set(items.filter((i) => i.family === family()).map((i) => i[v.tab]))].sort(byText);
    if (!values.includes(tab)) {
      let saved = null;
      try { saved = localStorage.getItem(TAB_KEY + family()); } catch { /* storage blocked */ }
      tab = values.includes(saved) ? saved : values[0] ?? null;
    }
    const tabLabel = (t) => (family() === 'lvl' ? t + '″' : t);
    el('tabs').innerHTML = values.map((t) =>
      '<button type="button" class="' + (t === tab ? '' : 'ghost') + '" data-tab="' + esc(t) + '" aria-pressed="' + (t === tab) + '">' + esc(tabLabel(t)) + '</button>').join('');
  }

  function visible() {
    const v = view();
    const words = el('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const retired = el('show-retired').checked;
    // The person's choice first, then the family's own order, then the name.
    const keys = (sort ? [sort] : []).concat(v.order.map((col) => ({ col, dir: 1 })), [{ col: 'item', dir: 1 }]);
    return items
      .filter((i) => (!family() || i.family === family()) && shown.has(i.stocking) && (retired || i.active))
      .filter((i) => !v.tab || i[v.tab] === tab)
      .filter((i) => {
        const text = (itemLabel(i) + ' ' + (i.note || '')).toLowerCase();
        return words.every((w) => text.includes(w));
      })
      .sort((a, b) => {
        for (const { col, dir } of keys) {
          const [x, y] = [COL[col].sort(a), COL[col].sort(b)];
          if (x === y) continue;
          if (x == null) return 1;   // blanks last, whichever way
          if (y == null) return -1;
          return (typeof x === 'number' ? x - y : byText(x, y)) * dir;
        }
        return 0;
      });
  }

  function paint() {
    paintTabs();
    const cols = view().cols.map((c) => [c, COL[c]]);
    el('cols').innerHTML = cols.map(([, c]) => '<col style="width:' + c.width + '%">').join('');
    el('head').innerHTML = cols.map(([key, c]) =>
      '<th' + (c.sort ? ' data-sort="' + key + '"' : '') + '>' + esc(c.head) +
      (sort && sort.col === key ? (sort.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>').join('');
    const rows = visible();
    el('rows').innerHTML = rows.map((i) =>
      '<tr data-id="' + i.id + '"' + (i.active ? '' : ' class="sub"') + '>' +
      cols.map(([, c]) => '<td' + (c.name ? ' class="name"' : '') + '>' + c.cell(i) +
        (c.name && !i.active && c === cols.find(([, x]) => x.name)[1] ? ' (retired)' : '') + '</td>').join('') +
      '</tr>').join('');
    el('count').textContent = rows.length + ' of ' + items.length + ' items shown.';
  }

  // Runs one change. On a stale save, the refusal carries the current item,
  // and the table shows it, so the other person's change is visible, never lost.
  async function save(route, body, done) {
    say('');
    try {
      const { item } = await send(route, body);
      items = items.some((i) => i.id === item.id) ? items.map((i) => (i.id === item.id ? item : i)) : items.concat(item);
      say(done(item), 'ok');
    } catch (err) {
      if (err.current) items = items.map((i) => (i.id === err.current.id ? err.current : i));
      say(err.message, 'bad', err.unconfirmed ? () => save(route, body, done) : null);
    }
    paint();
  }
  const itemOf = (target) => items.find((i) => String(i.id) === target.closest('tr').dataset.id);

  el('rows').addEventListener('change', (e) => {
    const field = e.target.dataset.field;
    if (!field) return;
    // A number box reports text it cannot read as blank, which would clear the saved value.
    if (e.target.validity && e.target.validity.badInput) return say('Type a whole number, or leave it blank.', 'bad');
    const item = itemOf(e.target);
    const raw = e.target.value.trim();
    const value = field === 'threshold' ? (raw === '' ? null : Number(raw)) : field === 'note' ? (raw || null) : raw;
    save('/api/items/edit', { key: crypto.randomUUID(), id: item.id, version: item.version, changes: { [field]: value } },
      (i) => itemLabel(i) + ': saved.');
  });

  el('rows').addEventListener('click', (e) => {
    const what = e.target.dataset && e.target.dataset.do;
    if (!what) return;
    const item = itemOf(e.target);
    if (what === 'rename') return openRename(item);
    save(what === 'retire' ? '/api/items/retire' : '/api/items/unretire', { key: crypto.randomUUID(), id: item.id, version: item.version },
      (i) => itemLabel(i) + (i.active ? ' is in use again.' : ' was retired. Its history stays.'));
  });

  el('head').addEventListener('click', (e) => {
    const col = e.target.dataset && e.target.dataset.sort;
    if (!col) return;
    sort = { col, dir: sort && sort.col === col ? -sort.dir : 1 };
    paint();
  });
  el('tabs').addEventListener('click', (e) => {
    const t = e.target.dataset && e.target.dataset.tab;
    if (t === undefined) return;
    tab = t;
    try { localStorage.setItem(TAB_KEY + family(), t); } catch { /* storage blocked: this visit only */ }
    paint();
  });
  el('show-status').addEventListener('click', (e) => {
    const s = e.target.dataset && e.target.dataset.status;
    if (!s) return;
    if (shown.has(s)) shown.delete(s); else shown.add(s);
    paintStatus();
    paint();
  });
  el('family').addEventListener('change', () => {
    try { localStorage.setItem(FAMILY_KEY, family()); } catch { /* storage blocked: this visit only */ }
    sort = null;
    tab = null;
    paint();
  });
  el('search').addEventListener('input', paint);
  el('show-retired').addEventListener('change', paint);

  // The name fields of a family, as inputs, filled from `item` when given.
  function identityInputs(fam, item) {
    const f = families.find((x) => x.code === fam);
    return f.identity.map((field) =>
      '<label class="field">' + esc(fieldLabel(fam, field)) +
      ' <input data-identity="' + field + '"' + (field === 'length_ft' ? ' type="number" min="1" step="1" style="width:6em"' : '') +
      ' required autocomplete="off" value="' + esc(item ? item[field] : '') + '"></label>').join(' ');
  }
  function identityFrom(container) {
    const identity = {};
    for (const input of container.querySelectorAll('input')) {
      identity[input.dataset.identity] = input.dataset.identity === 'length_ft' ? Number(input.value) : input.value;
    }
    return identity;
  }

  // "+ Add item": the fields follow the chosen family's identity fields.
  const paintAddFields = () => { el('add-fields').innerHTML = identityInputs(el('add-family').value); };
  el('add-open').addEventListener('click', () => {
    el('rename').hidden = true;
    el('add').hidden = false;
    el('add-family').value = family() || families[0].code;
    paintAddFields();
  });
  el('add-family').addEventListener('change', paintAddFields);
  el('add-cancel').addEventListener('click', () => { el('add').hidden = true; });
  el('add').addEventListener('submit', (e) => {
    e.preventDefault();
    save('/api/items/add', { key: crypto.randomUUID(), family: el('add-family').value, identity: identityFrom(el('add-fields')) }, (i) => {
      el('add').hidden = true;
      // Show the new item: no search text, its family, and its size or depth tab.
      el('search').value = '';
      if (family() && family() !== i.family) { el('family').value = i.family; sort = null; }
      if (VIEWS[i.family].tab) {
        tab = i[VIEWS[i.family].tab];
        try { localStorage.setItem(TAB_KEY + i.family, tab); } catch { /* storage blocked: this visit only */ }
      }
      return itemLabel(i) + ' was added as Special Order with no threshold. Set its stocking status in its row.';
    });
  });

  // Rename (admins): the same name fields, filled with the item's current name.
  function openRename(item) {
    renaming = item;
    el('add').hidden = true;
    el('rename-from').textContent = itemLabel(item);
    el('rename-fields').innerHTML = identityInputs(item.family, item);
    el('rename').hidden = false;
  }
  el('rename-cancel').addEventListener('click', () => { el('rename').hidden = true; });
  el('rename').addEventListener('submit', (e) => {
    e.preventDefault();
    // The item as it is now: a cell saved while the form was open changed its version.
    const item = items.find((i) => i.id === renaming.id);
    const was = itemLabel(item);
    save('/api/items/rename', { key: crypto.randomUUID(), id: item.id, version: item.version, identity: identityFrom(el('rename-fields')) }, (i) => {
      el('rename').hidden = true;
      return was + ' is now ' + itemLabel(i) + '.';
    });
  });

  load();
})();
</script>
</body>
</html>
