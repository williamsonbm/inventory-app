<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<!--
  sign-in.html — the one page open to a signed-out person (#77).

  Its style and script are inline, deliberately: a linked stylesheet or script
  would be one more address on the open list (src/app.js, OPEN), and every
  other address is closed until sign-in.

  Glue, NOT UNIT-TESTED: the form needs a browser, and this repo has no DOM
  harness. The route it posts to is tested in test/sign-in.test.js; the page
  itself is checked by hand (#77, Testing Decisions).
-->
<script>
  // Theme before first paint; same key and rule as the Planner's header.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('app.theme'); } catch (e) { /* storage blocked */ }
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #5d6677; --line: #d5dae2; --accent: #2457c5; --bad: #b3261e; }
  [data-theme="dark"] { --bg: #14171c; --panel: #1d2128; --text: #e6e9ee; --muted: #9aa3b2; --line: #343a45; --accent: #7aa2ff; --bad: #ff8a80; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line);
         border-radius: 8px; padding: 24px; display: grid; gap: 12px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); color: var(--text); }
  button { font: inherit; font-weight: 600; padding: 9px; border: 0; border-radius: 6px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: var(--bad); min-height: 1.45em; margin: 0; }
  .help { color: var(--muted); margin: 0; font-size: 14px; }
</style>
</head>
<body>
<form id="form" novalidate>
  <h1>RTW Inventory Tracker</h1>
  <label>Email address <input id="email" type="email" autocomplete="username" required autofocus maxlength="254"></label>
  <label>Password <input id="password" type="password" maxlength="200" autocomplete="current-password" required></label>
  <p class="error" id="error" role="alert"></p>
  <button id="submit">Sign in</button>
  <p class="help">No account, or forgot your password? Ask an admin.</p>
</form>
<script>
(() => {
  const el = (id) => document.getElementById(id);
  el('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    el('submit').disabled = true;
    el('error').textContent = '';
    try {
      const res = await fetch('/api/sign-in', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          email: el('email').value,
          password: el('password').value,
          next: new URLSearchParams(location.search).get('next') || undefined,
        }),
      });
      const body = await res.json();
      if (!body.ok) throw new Error(body.error);
      // The server checked `next` is an address on this site.
      location.assign(body.next);
    } catch (err) {
      el('error').textContent = err instanceof SyntaxError || err instanceof TypeError
        ? 'The app is not answering. Try again in a minute.' : err.message;
      el('submit').disabled = false;
    }
  });
})();
</script>
</body>
</html>
