<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LVL linear-footage planner</title>
<link rel="stylesheet" href="/planner.css">
<style>
  /* LVL-specific only — everything else is in /planner.css. */
  tr.depth td:first-child{border-left:3px solid var(--accent)}
  tr.depth.short td:first-child{border-left-color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <nav class="nav" aria-label="Planner switch"><a href="/">EWP</a><a href="/plates">Plates</a><a href="/hangers">Hangers</a><a href="/lvl" class="on">LVL</a><a href="/lumber">Lumber</a></nav>
    <h1 style="margin-top:14px">LVL Linear-Footage Planner</h1>
    <p class="sub">Multi-job LVL usage by depth, in linear feet, netted against stock.</p>
  </div>

  <div id="drop-mount"></div>

  <div class="row">
    <button id="btn-plan" disabled>Calculate linear feet</button>
    <button id="btn-clear" class="ghost" style="display:none">Clear</button>
    <span class="sub" id="msg"></span>
    <span id="busy" style="display:none;color:var(--muted)">Totaling LVL usage…</span>
  </div>

  <div id="out" style="display:flex;flex-direction:column;gap:14px"></div>
</div>

<script src="/csvPile.js"></script>
<script src="/planner-ui.js"></script>
<script>
(() => {
  const { esc, fmtNum: fmt, renderStats, renderWarnings, renderRejected, expandAllButtonHtml } = PlannerUI;
  const el = (id) => document.getElementById(id);
  const btnPlan = el('btn-plan'), btnClear = el('btn-clear'), busy = el('busy');
  const msg = el('msg'), out = el('out');
  // One delegated listener powers every expandable row (see PlannerUI.drilldowns).
  const drills = PlannerUI.drilldowns(out);

  // Sniff a stock file (item,span,qty/available) vs a MiTek material summary
  // (header cells "Job Name:", "LABEL", …).
  function isStockFile(text) {
    const head = String(text || '').slice(0, 1024).toLowerCase();
    return (head.includes('item') || head.includes('product') || head.includes('description')) &&
           head.includes('span') &&
           (head.includes('available') || head.includes('qty') || head.includes('on_hand'));
  }

  const dz = PlannerUI.dropZones({
    mount: el('drop-mount'),
    jobsTitle: 'Job material summaries',
    jobsHint: 'Drop several, or click to choose. One per job.',
    stockTitle: 'LVL stock CSV',
    stockHint: 'Same item,span,qty format as the EWP stock CSV.',
    isStockFile,
    onChange() {
      btnPlan.disabled = dz.isEmpty();
      btnClear.style.display = (!dz.isEmpty() || dz.getStock()) ? 'inline-block' : 'none';
      autoRun();
    },
  });

  btnClear.addEventListener('click', () => {
    dz.clear();
    msg.innerHTML = '';
    out.innerHTML = '';
  });

  async function runPlan() {
    if (dz.isEmpty()) { msg.innerHTML = ''; out.innerHTML = ''; btnPlan.disabled = true; return; }
    msg.innerHTML = '';
    out.innerHTML = '';
    busy.style.display = 'inline';
    btnPlan.disabled = true;

    try {
      const res = await fetch('/api/lvl/plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: dz.getJobs(), stock: dz.getStock() }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        msg.innerHTML = `<div class="note bad">${esc(data.error || 'Failed to total LVL usage.')}</div>`;
        return;
      }
      renderPlan(data);
    } catch (err) {
      msg.innerHTML = `<div class="note bad">Request failed: ${esc(err.message)}</div>`;
    } finally {
      busy.style.display = 'none';
      btnPlan.disabled = dz.isEmpty();
    }
  }
  // Auto-recompute: any pile change (a drop, a remove, Clear all, or a change
  // from another tab) reruns; a multi-file drop debounces to one run.
  const autoRun = PlannerUI.debounce(runPlan, 80);
  btnPlan.addEventListener('click', runPlan);
  autoRun();   // on load: run from the shared pile (or clear if it's empty)

  // Sort state for the Included Jobs table (shared across in-place repaints).
  // col null = drop order; 'num' sorts Job # numerically, 'name' sorts Job Name.
  let jobSort = { col: null, dir: 'asc' };
  // Sort state for the By-depth table. col null = natural depth order; 'depth'
  // sorts the label, 'need'/'buy' sort those linear-foot columns.
  let depthSort = { col: null, dir: 'asc' };

  function renderPlan(p) {
    const sum = p.summary;
    let html = '';

    if (p.rerouted && p.rerouted.length) {
      html += `<div class="note ok">Auto-detected <b>${esc(p.rerouted.map(r=>r.name).join(', '))}</b> as the LVL stock file.</div>`;
    }
    if (p.stockError) {
      html += `<div class="note bad"><b>Stock file not read:</b> ${esc(p.stockError)}<br>Totaled usage only — nothing was netted against stock.</div>`;
    } else if (!p.hasStock) {
      html += '<div class="note"><b>No stock file.</b> Figures below are usage totals only — no remaining/needed columns.</div>';
    } else {
      html += `<div class="note ok"><b>Stock:</b> ${esc(p.stockFileName || 'file')}</div>`;
    }
    html += renderWarnings(p.warnings);

    // Stats bar. Labels mirror the By-depth column vocabulary (Need / Have /
    // Buy) so the same concept never wears two names.
    const stats = [
      { label: 'Jobs', value: fmt(sum.jobsCount) },
      { label: 'Depths', value: fmt(sum.depthsCount) },
      { label: 'Need (LF)', value: fmt(sum.totalUsedLf) },
    ];
    if (p.hasStock) {
      stats.push({ label: 'Have (LF)', value: fmt(sum.totalStockLf) });
      stats.push({ label: 'Buy (LF)', value: fmt(sum.totalNeededLf), warn: true });
    }
    html += renderStats(stats);

    // By-depth table. Depth / Need / Buy are sortable; the table is painted by
    // paintDepths() after the shell mounts, so re-sorting repaints only this
    // table. Row expansion is handled by the delegated `drills` listener.
    if (p.byDepth.length > 0) {
      html += `
        <div class="row" style="justify-content:space-between;margin-top:0">
          <div class="eyebrow" style="margin:0">By depth — ${p.byDepth.length} size(s)</div>
          <button class="ghost" id="btn-toggle-depths" style="padding:4px 12px;font-size:12.5px">Expand all</button>
        </div>
        <div class="tw"><table id="lvl-depth-table"></table></div>
      `;
    } else {
      html += `<div class="note ok">No LVL usage found in these files.</div>`;
    }

    // Included jobs — Job # and Job Name are sortable, and each job with LVL
    // rows expands to the line items on its material sheet. The table is painted
    // by paintJobs() after the shell mounts, so re-sorting repaints only this
    // table and leaves the rest of the page (and the open panel) untouched.
    if (p.jobs.length > 0) {
      html += `
        <details class="sec">
          <summary>Included Jobs (${p.jobs.length} files)</summary>
          ${expandAllButtonHtml('btn-toggle-jobs')}
          <div class="tw" style="margin-top:10px">
            <table id="lvl-jobs-table"></table>
          </div>
        </details>
      `;
    }

    html += renderRejected(p.rejected);

    out.innerHTML = html;

    // Expand all / collapse all, one button per drilldown group. Individual
    // row clicks are handled by the delegated `drills` listener; these drive
    // each group in bulk.
    PlannerUI.wireExpandAll(out, drills, 'depth', 'btn-toggle-depths');
    PlannerUI.wireExpandAll(out, drills, 'job', 'btn-toggle-jobs');

    if (p.byDepth.length > 0) paintDepths();
    if (p.jobs.length > 0) paintJobs();

    // Paint (or repaint) the By-depth table for the current sort. A repaint
    // collapses the drill rows, so the Expand-all button is reset to match.
    function paintDepths() {
      const table = el('lvl-depth-table');
      if (!table) return;
      const rows = PlannerUI.sortRows(p.byDepth, depthSort,
        { depth: (r) => r.label, need: (r) => r.usedLf, buy: (r) => r.neededLf });
      table.innerHTML = depthsInner(rows);
      PlannerUI.wireSort(table, 'depthsort', depthSort, paintDepths);
      PlannerUI.resetExpandAll('btn-toggle-depths');
    }

    function depthsInner(rows) {
      const hasStock = p.hasStock;
      const sortableTh = (col, label) =>
        `<th class="sortable n" data-depthsort="${col}">${label} ${PlannerUI.sortIcon(depthSort.col === col, depthSort.dir)}</th>`;
      let s = `
        <thead>
          <tr>
            <th class="sortable" data-depthsort="depth">Depth ${PlannerUI.sortIcon(depthSort.col === 'depth', depthSort.dir)}</th>
            ${sortableTh('need', 'Need (LF)')}
            ${hasStock ? `<th class="n">Have (LF)</th><th class="n">Remaining (LF)</th>${sortableTh('buy', 'Buy (LF)')}<th class="n">Incoming (LF)</th>` : ''}
            <th></th>
          </tr>
        </thead>
        <tbody>`;
      rows.forEach((row, idx) => {
        const isShort = hasStock && row.neededLf > 0;
        s += `
          <tr class="depth${isShort ? ' short' : ''}" data-group="depth" data-toggle="${idx}">
            <td><span class="caret">▸</span><span class="mono"><b>${esc(row.label)}</b></span></td>
            <td class="n">${fmt(row.usedLf)}</td>
            ${hasStock ? `
              <td class="n ${row.stockLf === 0 ? 'zero-ink' : ''}">${fmt(row.stockLf)}</td>
              <td class="n">${fmt(row.remainingLf)}</td>
              <td class="n"><strong style="color:${isShort ? 'var(--warn)' : 'inherit'}">${fmt(row.neededLf)}</strong></td>
              <td class="n ${row.incomingLf ? '' : 'zero-ink'}">${row.incomingLf ? `+${fmt(row.incomingLf)}` : '0'}</td>
            ` : ''}
            <td>${isShort ? '<span class="chip short">Short</span>' : (hasStock ? '<span class="chip covered">Covered</span>' : '')}</td>
          </tr>
          <tr class="jobs" id="drill-depth-${idx}" style="display:none">
            <td colspan="${hasStock ? 7 : 3}">
              <div class="drill">
                <h4>Driving usage — ${row.jobs.length} job(s) at ${esc(row.label)}</h4>
                <table class="drill-t">
                  <thead>
                    <tr><th>Job #</th><th>Job Name</th><th>Delivery</th><th class="n">LF</th></tr>
                  </thead>
                  <tbody>
                    ${row.jobs.map((j) => `
                      <tr>
                        <td class="mono"><strong>${esc(j.jobNumber || '—')}</strong></td>
                        <td>${esc(j.jobName || '—')}</td>
                        <td>${esc(j.deliveryDate || '—')}</td>
                        <td class="n"><strong>${fmt(j.lf)}</strong></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </td>
          </tr>`;
      });
      return s + '</tbody>';
    }

    // Paint (or repaint) the Included Jobs table for the current sort. Row
    // expansion is handled by the delegated `drills` listener, so a repaint only
    // needs to re-bind the sort headers — the panel and other sections are
    // untouched.
    function paintJobs() {
      const table = el('lvl-jobs-table');
      if (!table) return;
      const jobs = PlannerUI.sortRows(p.jobs, jobSort,
        { num: (j) => j.jobNumber, name: (j) => j.jobName });
      table.innerHTML = jobsInner(jobs);
      PlannerUI.wireSort(table, 'jobsort', jobSort, paintJobs);
      PlannerUI.resetExpandAll('btn-toggle-jobs');
    }

    function jobsInner(jobs) {
      return `
        <thead>
          <tr>
            <th></th>
            <th class="sortable" data-jobsort="num">Job # ${PlannerUI.sortIcon(jobSort.col === 'num', jobSort.dir)}</th>
            <th class="sortable" data-jobsort="name">Job Name ${PlannerUI.sortIcon(jobSort.col === 'name', jobSort.dir)}</th>
            <th>Delivery</th>
            <th>By Depth</th>
            <th class="n">Total LF</th>
          </tr>
        </thead>
        <tbody>
          ${jobs.map((j, idx) => {
            const hasItems = j.items && j.items.length > 0;
            return `
            <tr${hasItems ? ` data-group="job" data-toggle="${idx}"` : ''}>
              <td>${hasItems ? '<span class="caret">▸</span>' : ''}</td>
              <td class="mono"><strong>${esc(j.jobNumber || '—')}</strong></td>
              <td>${esc(j.jobName || '—')}</td>
              <td>${esc(j.deliveryDate || '—')}</td>
              <td>${j.byDepth.map((d) => `${esc(d.label)}: ${fmt(d.lf)}`).join(', ') || '—'}</td>
              <td class="n"><strong>${fmt(j.totalLf)}</strong></td>
            </tr>
            ${hasItems ? `
            <tr class="jobs" id="drill-job-${idx}" style="display:none">
              <td colspan="6">
                <div class="drill">
                  <h4>Line items — ${j.items.length} row(s) on ${esc(j.jobNumber || j.name)}'s material sheet</h4>
                  <table class="drill-t">
                    <thead>
                      <tr>
                        <th>Label</th>
                        <th>Size</th>
                        <th class="n">Qty</th>
                        <th>Length</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${j.items.map((it) => `
                        <tr>
                          <td class="mono">${esc(it.label || '—')}</td>
                          <td>${esc(it.size)}</td>
                          <td class="n">${fmt(it.qty)}</td>
                          <td class="mono">${esc(it.length)}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </td>
            </tr>
            ` : ''}
          `; }).join('')}
        </tbody>
      `;
    }
  }
})();
</script>
</body>
</html>
