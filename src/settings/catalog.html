<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings</title>
<script>
  // Theme before first paint; same key and rule as the Planner's header.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('app.theme'); } catch (e) { /* storage blocked */ }
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/planner.css">
</head>
<body>
<!--
  catalog.html — the catalog's Settings pages (#81 part 1): Pack sizes,
  Suppliers, Reasons and LVL thresholds, plus the Inventory group's Working
  day (#81 part 3, story 28). One page served at five addresses (src/app.js);
  it shows the section its address names. Deliberately one file, not five:
  the sections differ only in their table and form, and each would repeat
  the same header, message and save code.

  Glue, NOT UNIT-TESTED: the tables need a browser, and this repo has no DOM
  harness. Every route it calls is tested in test/inventory.test.js. The
  layout is checked by hand (#81, Testing Decisions).
-->
<header class="appbar">
  <div class="appbar-primary">
    <span class="appbar-brand">RTW Inventory Tracker</span>
    <button type="button" class="themebtn" id="theme-btn" aria-label="Switch between light and dark">☾</button>
    <span class="appbar-user" id="user-name"></span>
    <button type="button" class="ghost appbar-signout" id="sign-out">Sign out</button>
  </div>
  <nav class="appbar-nav" aria-label="Modes"><a href="/">Planner</a><a href="/inventory">Inventory</a><a href="/settings/users" class="here" aria-current="page">Settings</a><a href="/activity">Activity Log</a></nav>
  <nav class="appbar-filter" aria-label="Tasks" id="tasks">
    <span class="label" id="accounts-label">Accounts</span>
    <div class="seg" role="group" aria-labelledby="accounts-label"><a href="/settings/users">Users</a><a href="/password">Your password</a></div>
    <span class="label" id="catalog-label">Catalog</span>
    <div class="seg" role="group" aria-labelledby="catalog-label"><a href="/settings/pack-sizes">Pack sizes</a><a href="/settings/suppliers">Suppliers</a><a href="/settings/reasons">Reasons</a><a href="/settings/lvl-thresholds">LVL thresholds</a></div>
    <span class="label" id="inventory-label">Inventory</span>
    <div class="seg" role="group" aria-labelledby="inventory-label"><a href="/settings/working-day">Working day</a><a href="/settings/count-approval">Count approval</a></div>
  </nav>
</header>

<div class="wrap">
  <div id="message" role="status"></div>
  <form id="add" class="row"></form>
  <div class="row"><label class="field" id="search-field" hidden>Search <input id="search" type="search" autocomplete="off"></label></div>
  <div class="tw"><table class="one-line catalog"><thead id="head"></thead><tbody id="rows"></tbody></table></div>
  <p class="sub" id="help"></p>
</div>

<script src="/app-header.js"></script>
<script src="/planner-ui.js"></script>
<script>
(async () => {
  const { esc } = PlannerUI;
  const { send, say, itemLabel } = AppHeader;
  const el = (id) => document.getElementById(id);
  if (!await AppHeader.me) return;

  const input = (attrs, value) => '<input ' + attrs + ' value="' + esc(value ?? '') + '">';
  const button = (what, text) => '<button type="button" class="ghost" data-do="' + what + '">' + esc(text) + '</button>';

  // Each section: its title, what it loads, its add form, its table, and what
  // a click or a changed cell in a row saves. `rows` is what paint() lists;
  // each row's `id` finds it again when a cell changes.
  const SECTIONS = {
    'pack-sizes': {
      title: 'Pack sizes',
      help: 'In pieces. Each item has at most one size of each kind its family comes in, and Kind lists those it has none of yet. Changing a size here changes no receipt or count already saved: each keeps the size it was entered with.',
      async load() {
        const [catalog, packs] = await Promise.all([get('/api/items'), get('/api/pack-sizes')]);
        this.items = catalog.items;
        this.kinds = Object.fromEntries(catalog.families.map((f) => [f.code, f.pack_kinds]));
        this.packs = packs.pack_sizes;
        // A plate and a hanger may share a SKU, so a shared name carries its family.
        const uses = new Map();
        for (const i of this.items) uses.set(itemLabel(i), (uses.get(itemLabel(i)) || 0) + 1);
        this.name = (i) => (uses.get(itemLabel(i)) > 1 ? itemLabel(i) + ' (' + i.family + ')' : itemLabel(i));
      },
      addForm() {
        return '<label class="field">Item <input id="f-item" list="item-list" required autocomplete="off"></label>' +
          '<datalist id="item-list">' + this.items.filter((i) => i.active).map((i) => '<option value="' + esc(this.name(i)) + '">').join('') + '</datalist>' +
          '<label class="field">Kind <select id="f-kind"></select></label>' +
          '<label class="field">Pieces <input id="f-pieces" type="number" min="1" step="1" required style="width:7em"></label><button>Add pack size</button>';
      },
      picked() { return this.items.find((i) => this.name(i) === el('f-item').value.trim()); },
      // Kind offers only what the picked item's family comes in, less the
      // kinds it already has a size for: one size of each (owner, 2026-10-02).
      onAddInput() {
        const item = this.picked();
        const has = new Set(this.packs.filter((p) => item && p.item_id === item.id).map((p) => p.kind));
        const left = item ? this.kinds[item.family].filter((k) => !has.has(k)) : [];
        el('f-kind').innerHTML = left.length
          ? left.map((k) => '<option>' + esc(k) + '</option>').join('')
          : '<option value="">' + (item ? 'has every kind' : 'pick an item') + '</option>';
      },
      addBody() {
        const item = this.picked();
        if (!item) throw new Error('Pick an item from the list.');
        if (!el('f-kind').value) throw new Error(this.name(item) + ' has a size of every kind already. Change it in its row.');
        return ['/api/pack-sizes/add', { item_id: item.id, kind: el('f-kind').value, pieces: Number(el('f-pieces').value) }];
      },
      head: '<tr><th>Item</th><th>Pack sizes, in pieces</th></tr>',
      rows(words) {
        const byItem = new Map();
        for (const p of this.packs) byItem.set(p.item_id, (byItem.get(p.item_id) || []).concat(p));
        return this.items
          .filter((i) => byItem.has(i.id) || this.kinds[i.family].includes('pallet'))
          .filter((i) => words.every((w) => this.name(i).toLowerCase().includes(w)))
          .map((i) => {
            const packs = byItem.get(i.id) || [];
            const cells = packs.map((p) => '<label class="field inline">' + esc(p.kind) + ' ' +
              input('type="number" min="1" step="1" style="width:6em" data-pack="' + p.id + '" aria-label="' + esc(p.kind) + ' pieces"', p.pieces) + '</label>');
            // S18: an item that comes in pallets (plates) but has no pallet size
            // has an unknown one, never a guess.
            if (this.kinds[i.family].includes('pallet') && !packs.some((p) => p.kind === 'pallet')) cells.push('<span class="sub">pallet size unknown</span>');
            return '<tr><td class="name">' + esc(this.name(i)) + '</td><td>' + cells.join(' ') + '</td></tr>';
          });
      },
      onChange(target) {
        const p = this.packs.find((x) => String(x.id) === target.dataset.pack);
        return ['/api/pack-sizes/change', { id: p.id, version: p.version, pieces: Number(target.value) }];
      },
      saved(reply) { this.packs = upsert(this.packs, reply.pack_size, 'id'); return 'Pack size saved.'; },
      current(row) { this.packs = upsert(this.packs, row, 'id'); },
    },

    suppliers: {
      title: 'Suppliers',
      help: 'Picked on each PO, so each supplier is spelled one way.',
      async load() { this.list = (await get('/api/suppliers')).suppliers; },
      addForm: () => '<label class="field">Name <input id="f-name" required autocomplete="off" maxlength="60"></label><button>Add supplier</button>',
      addBody: () => ['/api/suppliers/add', { name: el('f-name').value }],
      head: '<tr><th>Name</th></tr>',
      rows(words) {
        return this.list.filter((s) => words.every((w) => s.name.toLowerCase().includes(w)))
          .map((s) => '<tr><td>' + input('data-id="' + s.id + '" maxlength="60" aria-label="Supplier name"', s.name) + '</td></tr>');
      },
      onChange(target) {
        const s = this.list.find((x) => String(x.id) === target.dataset.id);
        return ['/api/suppliers/rename', { id: s.id, version: s.version, name: target.value }];
      },
      saved(reply) { this.list = upsert(this.list, reply.supplier, 'id'); return reply.supplier.name + ' saved.'; },
      current(row) { this.list = upsert(this.list, row, 'id'); },
    },

    reasons: {
      title: 'Reasons',
      help: 'Picked for a correction, an unmatched count line or a closed PO line. A reason is retired, never deleted, so old records keep it. The app itself uses the reasons marked "used by the app", so those cannot be retired.',
      async load() { this.list = (await get('/api/reasons')).reasons; },
      addForm: () => '<label class="field">Reason <input id="f-text" required autocomplete="off" maxlength="60"></label><button>Add reason</button>',
      addBody: () => ['/api/reasons/add', { text: el('f-text').value }],
      head: '<tr><th>Reason</th><th></th></tr>',
      rows(words) {
        return this.list.filter((r) => words.every((w) => r.text.toLowerCase().includes(w)))
          .map((r) => '<tr data-id="' + r.id + '"' + (r.active ? '' : ' class="sub"') + '><td>' + esc(r.text) + (r.active ? '' : ' (retired)') + '</td><td>' +
            (r.built_in ? '<span class="sub">used by the app</span>' : button(r.active ? 'retire' : 'unretire', r.active ? 'Retire' : 'Un-retire')) + '</td></tr>');
      },
      onClick(what, id) {
        const r = this.list.find((x) => String(x.id) === id);
        return [what === 'retire' ? '/api/reasons/retire' : '/api/reasons/unretire', { id: r.id, version: r.version }];
      },
      saved(reply) { this.list = upsert(this.list, reply.reason, 'id'); return '"' + reply.reason.text + '" saved.'; },
      current(row) { this.list = upsert(this.list, row, 'id'); },
    },

    'lvl-thresholds': {
      title: 'LVL thresholds',
      help: 'LVL is reordered per depth, in linear feet (a board of 48′ is 48 linear feet). Blank means "not set"; 0 means "reorder when none are left".',
      async load() { this.list = (await get('/api/lvl-depth-thresholds')).thresholds; },
      head: '<tr><th>Depth</th><th>Threshold (linear feet)</th></tr>',
      rows() {
        return this.list.map((t) => '<tr><td>' + esc(t.depth) + '″</td><td>' +
          input('type="number" min="0" step="1" style="width:8em" data-depth="' + esc(t.depth) + '" aria-label="Threshold for ' + esc(t.depth) + '"', t.threshold_lf) + '</td></tr>');
      },
      onChange(target) {
        const t = this.list.find((x) => x.depth === target.dataset.depth);
        return ['/api/lvl-depth-thresholds/set', {
          depth: t.depth, version: t.version, threshold_lf: target.value.trim() === '' ? null : Number(target.value),
        }];
      },
      saved(reply) { this.list = upsert(this.list, reply.threshold, 'depth'); return reply.threshold.depth + '″ threshold saved.'; },
      current(row) { this.list = upsert(this.list, row, 'depth'); },
    },

    'working-day': {
      title: 'Working day',
      help: 'When someone counts an item, anything entered on it within this many working days before the count asks whether it happened before or after the count. Weekends are always skipped; holidays are not. Everyone can see this; only an admin can change it.',
      async load() {
        this.setting = (await get('/api/working-day')).setting[0];
        this.admin = (await AppHeader.me).admin;
      },
      head: '<tr><th>Working day window</th></tr>',
      rows() {
        return [this.admin
          ? '<tr><td>' + input('type="number" min="1" max="20" step="1" style="width:6em" data-days aria-label="Working day window, in days"', this.setting.value) + '</td></tr>'
          : '<tr><td>' + esc(String(this.setting.value)) + ' working day(s)</td></tr>'];
      },
      onChange(target) {
        return ['/api/working-day/set', { version: this.setting.version, days: Number(target.value) }];
      },
      saved(reply) { this.setting = reply.setting; return 'Working day window saved.'; },
      current(row) { this.setting = row; },
    },

    'count-approval': {
      title: 'Count approval',
      help: 'When this is on, a count is approved by someone who did not start, save or submit it. When it is off, as it starts, anyone may approve a count, the person who counted included. Everyone can see this; only an admin can change it.',
      async load() {
        const [got, me] = await Promise.all([get('/api/count-approval'), AppHeader.me]);
        this.setting = got.setting[0];
        this.admin = me.admin;
      },
      head: '<tr><th>A second person approves each count</th></tr>',
      rows() {
        return [this.admin
          ? '<tr><td><label><input type="checkbox" data-approval' + (this.setting.value ? ' checked' : '') + '> On</label></td></tr>'
          : '<tr><td>' + (this.setting.value ? 'On' : 'Off') + '</td></tr>'];
      },
      onChange(target) {
        return ['/api/count-approval/set', { version: this.setting.version, on: target.checked }];
      },
      saved(reply) { this.setting = reply.setting; return 'Count approval saved.'; },
      current(row) { this.setting = row; },
    },
  };

  const name = location.pathname.replace(/\/+$/, '').split('/').pop();  // Express also serves /settings/reasons/
  const section = SECTIONS[name];
  document.title = section.title + ' · Settings';
  for (const a of el('tasks').querySelectorAll('a')) {
    if (a.getAttribute('href') === location.pathname) a.setAttribute('aria-current', 'page');
  }
  el('help').textContent = section.help;
  el('head').innerHTML = section.head;
  el('search-field').hidden = !['pack-sizes', 'suppliers', 'reasons'].includes(name);

  function upsert(list, row, key) {
    return list.some((x) => x[key] === row[key]) ? list.map((x) => (x[key] === row[key] ? row : x)) : list.concat(row);
  }
  async function get(route) {
    const body = await fetch(route).then((r) => r.json()).catch(() => ({ ok: false, error: 'This page did not load. Reload it to try again.' }));
    if (!body.ok) throw new Error(body.error);
    return body;
  }

  function paint() {
    const typing = AppHeader.typingIn(el('rows'));
    const words = el('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    el('rows').innerHTML = section.rows(words).join('');
    typing.restore();
  }

  // Runs one change. On a stale save, the refusal carries the current row,
  // and the table shows it, so the other person's change is visible, never lost.
  async function save([route, body], done) {
    say('');
    const sent = { key: crypto.randomUUID(), ...body };
    const attempt = async () => {
      try {
        say(section.saved(await send(route, sent)), 'ok');
        if (done) done();
      } catch (err) {
        if (err.current) section.current(err.current);
        say(err.message, 'bad', err.unconfirmed ? attempt : null);
      }
      paint();
    };
    await attempt();
  }

  el('rows').addEventListener('change', (e) => {
    if (!section.onChange) return;
    // A number box reports text it cannot read as blank, which would clear the saved value.
    if (e.target.validity && e.target.validity.badInput) return say('Type a whole number, or leave it blank.', 'bad');
    save(section.onChange(e.target));
  });
  el('rows').addEventListener('click', (e) => {
    const what = e.target.dataset && e.target.dataset.do;
    if (what) save(section.onClick(what, e.target.closest('tr').dataset.id));
  });
  el('search').addEventListener('input', paint);
  el('add').addEventListener('submit', (e) => {
    e.preventDefault();
    try {
      save(section.addBody(), () => {
        el('add').reset();
        if (section.onAddInput) section.onAddInput();
      });
    } catch (err) {
      say(err.message, 'bad');
    }
  });

  try {
    await section.load();
  } catch (err) {
    return say(err.message, 'bad');
  }
  if (section.addForm) el('add').innerHTML = section.addForm(); else el('add').hidden = true;
  if (section.onAddInput) {
    el('add').addEventListener('input', (e) => { if (e.target.id === 'f-item') section.onAddInput(); });
    section.onAddInput();
  }
  paint();
})();
</script>
</body>
</html>
