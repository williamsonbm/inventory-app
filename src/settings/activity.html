<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity Log</title>
<script>
  // Theme before first paint; same key and rule as the Planner's header.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('app.theme'); } catch (e) { /* storage blocked */ }
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/planner.css">
</head>
<body>
<!--
  activity.html — the Activity Log (#77; its own mode since #81 part 1): who did what and when,
  newest first, a page at a time, filtered by family, person, action and office day.

  Glue, NOT UNIT-TESTED: the filters and the table need a browser, and this
  repo has no DOM harness. The route's filters, order, paging and Eastern
  office days are tested in test/users.test.js, the family filter in
  test/inventory.test.js; the page is checked by hand
  (#77, Testing Decisions).
-->
<header class="appbar">
  <div class="appbar-primary">
    <span class="appbar-brand">RTW Inventory Tracker</span>
    <button type="button" class="themebtn" id="theme-btn" aria-label="Switch between light and dark">☾</button>
    <span class="appbar-user" id="user-name"></span>
    <button type="button" class="ghost appbar-signout" id="sign-out">Sign out</button>
  </div>
  <nav class="appbar-nav" aria-label="Modes"><a href="/">Planner</a><a href="/inventory">Inventory</a><a href="/settings/users">Settings</a><a href="/activity" class="here" aria-current="page">Activity Log</a></nav>
  <!-- The filters sit in the grey bar, as Family does on the Planner and
       Inventory (owner, 2026-10-02). Family is the same bar, with the same
       saved choice (story 56, Q65); a click on it shows that family at once. -->
  <form id="filters" class="appbar-filter">
    <span class="label" id="family-label">Family</span>
    <div class="seg" id="family-filter" role="group" aria-labelledby="family-label"><button type="button" class="placeholder" tabindex="-1" aria-hidden="true">All</button></div>
    <label class="label">Person <select id="person"><option value="">Everyone</option></select></label>
    <label class="label">Action <select id="action"><option value="">Every action</option></select></label>
    <label class="label">From <input id="from" type="date"></label>
    <label class="label">To <input id="to" type="date"></label>
    <button>Show</button>
  </form>
</header>

<div class="wrap">
  <div id="message" role="status"></div>
  <table class="log">
    <colgroup><col class="c-when"><col class="c-who"><col class="c-action"><col class="c-what"><col></colgroup>
    <thead><tr><th>When (Eastern)</th><th>Who</th><th>Action</th><th>What</th><th>Was → now</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="row"><button type="button" class="ghost" id="older" hidden>Older entries</button></div>
</div>

<script src="/app-header.js"></script>
<script src="/planner-ui.js"></script>
<script>
(async () => {
  const { esc } = PlannerUI;
  const { showTime } = AppHeader;
  const el = (id) => document.getElementById(id);
  if (!await AppHeader.me) return;
  let before = null;
  let listsShown = false;
  let family = 'all';

  async function load(more) {
    const q = new URLSearchParams();
    for (const id of ['person', 'action', 'from', 'to']) if (el(id).value) q.set(id, el(id).value);
    if (family !== 'all') q.set('family', family);
    if (more) q.set('before', before);
    const body = await (await fetch('/api/activity?' + q)).json();
    if (!body.ok) { el('message').innerHTML = '<div class="note bad">' + esc(body.error) + '</div>'; return; }
    el('message').innerHTML = '';
    if (!listsShown) {
      el('action').insertAdjacentHTML('beforeend', body.actions.map((a) => '<option>' + esc(a) + '</option>').join(''));
      listsShown = true;
      // Opens on the saved family, which loads again only when it is not All.
      AppHeader.familyBar(body.families.map((f) => ({ code: f.code, label: f.name })), (f) => {
        if (f === family) return;
        family = f;
        load(false);
      });
    }
    const html = body.entries.map((e) => '<tr><td>' + esc(showTime(e.at)) + '</td><td>' + esc(e.who) + '</td><td>' +
      esc(e.action) + '</td><td>' + esc(e.target || '') + '</td><td>' + esc(e.change) + '</td></tr>').join('');
    if (more) el('rows').insertAdjacentHTML('beforeend', html);
    else el('rows').innerHTML = html || '<tr><td colspan="5" class="sub">Nothing matches.</td></tr>';
    before = body.before;
    el('older').hidden = before === null;
  }

  const people = await (await fetch('/api/users')).json();
  if (people.ok) {
    el('person').insertAdjacentHTML('beforeend',
      people.users.map((u) => '<option value="' + u.id + '">' + esc(u.name) + '</option>').join(''));
  }
  el('filters').addEventListener('submit', (e) => { e.preventDefault(); load(false); });
  el('older').addEventListener('click', () => load(true));
  load(false);
})();
</script>
</body>
</html>
