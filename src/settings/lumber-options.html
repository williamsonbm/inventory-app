<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumber buying options · Settings</title>
<script>
  // Theme before first paint; same key and rule as the Planner's header.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('app.theme'); } catch (e) { /* storage blocked */ }
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/planner.css">
</head>
<body>
<!--
  lumber-options.html — Settings → Lumber buying options (#81 part 1, story
  25): the stock lengths bought for each lumber size and grade, and the grade
  redirects, shared by every computer. The editor itself is in
  src/planner/lumber-section.js (mountOptions), which also holds the
  Planner's redirect picker, so both save the same way.

  Glue, NOT UNIT-TESTED: the editor needs a browser, and this repo has no DOM
  harness. Its routes are tested in test/inventory.test.js. Checked by hand.
-->
<header class="appbar">
  <div class="appbar-primary">
    <span class="appbar-brand">Inventory</span>
    <button type="button" class="themebtn" id="theme-btn" aria-label="Switch between light and dark">☾</button>
    <span class="appbar-user" id="user-name"></span>
    <button type="button" class="ghost appbar-signout" id="sign-out">Sign out</button>
  </div>
  <nav class="appbar-nav" aria-label="Modes"><a href="/">Planner</a><a href="/inventory">Inventory</a><a href="/settings/users" class="here" aria-current="page">Settings</a><a href="/activity">Activity Log</a></nav>
  <nav class="appbar-nav appbar-tasks" aria-label="Tasks" id="tasks"><a href="/settings/users">Users</a><a href="/settings/pack-sizes">Pack sizes</a><a href="/settings/suppliers">Suppliers</a><a href="/settings/reasons">Reasons</a><a href="/settings/lumber-options" class="here" aria-current="page">Lumber buying options</a><a href="/settings/lvl-thresholds">LVL thresholds</a><a href="/password">Your password</a></nav>
</header>

<div class="wrap wide">
  <div id="options"></div>
</div>

<script src="/app-header.js"></script>
<script src="/planner-ui.js"></script>
<script src="/lumber-section.js"></script>
<script>
(async () => {
  if (!await AppHeader.me) return;
  PlannerSections.lumber.mountOptions(document.getElementById('options'));
})();
</script>
</body>
</html>
