<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your password · Settings</title>
<script>
  // Theme before first paint; same key and rule as the Planner's header.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('app.theme'); } catch (e) { /* storage blocked */ }
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/planner.css">
</head>
<body>
<!--
  password.html — Settings → Your password, and "choose your password" (#77).
  A person with a temporary password is sent here from every page, and can
  reach nothing else but Sign out until they choose their own.

  Glue, NOT UNIT-TESTED: the form needs a browser, and this repo has no DOM
  harness. The route it posts to, its rules, and the sign-out of every other
  computer are tested in test/sign-in.test.js; the page is checked by hand
  (#77, Testing Decisions).
-->
<header class="appbar">
  <div class="appbar-primary">
    <span class="appbar-brand">Inventory</span>
    <button type="button" class="themebtn" id="theme-btn" aria-label="Switch between light and dark">☾</button>
    <span class="appbar-user" id="user-name"></span>
    <button type="button" class="ghost appbar-signout" id="sign-out">Sign out</button>
  </div>
  <div id="navs" hidden>
    <nav class="appbar-nav" aria-label="Modes"><a href="/">Planner</a><a href="/inventory">Inventory</a><a href="/settings/users" class="here" aria-current="page">Settings</a><a href="/activity">Activity Log</a></nav>
    <nav class="appbar-nav appbar-tasks" aria-label="Tasks"><a href="/settings/users">Users</a><a href="/settings/pack-sizes">Pack sizes</a><a href="/settings/suppliers">Suppliers</a><a href="/settings/reasons">Reasons</a><a href="/settings/lumber-options">Lumber buying options</a><a href="/settings/lvl-thresholds">LVL thresholds</a><a href="/password" class="here" aria-current="page">Your password</a></nav>
  </div>
</header>

<div class="wrap">
  <h2 id="heading">Change your password</h2>
  <p class="sub" id="why">Changing it signs you out on every other computer.</p>
  <form id="form" style="display:grid;gap:12px;max-width:360px">
    <label class="field"><span id="current-label">Current password</span>
      <input id="current" type="password" autocomplete="current-password" required></label>
    <label class="field">New password (at least 12 characters)
      <input id="password" type="password" autocomplete="new-password" required minlength="12"></label>
    <label class="field">New password again
      <input id="again" type="password" autocomplete="new-password" required></label>
    <div class="row"><button id="save">Save password</button></div>
  </form>
  <div id="message" role="status"></div>
</div>

<script src="/app-header.js"></script>
<script>
(async () => {
  const el = (id) => document.getElementById(id);
  const me = await AppHeader.me;
  if (!me) return;
  if (me.passwordTemporary) {
    el('heading').textContent = 'Choose your password';
    el('why').textContent = 'An admin gave you a temporary password. Choose your own before you go on.';
    el('current-label').textContent = 'Temporary password';
  } else {
    el('navs').hidden = false;
  }

  const say = (text, kind) => {
    el('message').innerHTML = text ? '<div class="note ' + kind + '"></div>' : '';
    if (text) el('message').firstChild.textContent = text;
  };
  // A change that saved makes this computer's old cookie out of date, so a
  // retry after a lost answer cannot act twice: it is refused as signed out.
  // The message says how to tell whether the change saved.
  el('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (el('password').value !== el('again').value) return say('The two new passwords differ.', 'bad');
    el('save').disabled = true;
    try {
      await AppHeader.send('/api/password',
        { key: crypto.randomUUID(), current: el('current').value, password: el('password').value });
      if (me.passwordTemporary) return location.assign('/');
      el('form').reset();
      say('Your password is changed. Every other computer is signed out.', 'ok');
    } catch (err) {
      say(err.unconfirmed
        ? 'The change was not confirmed. Sign out, then sign in with the new password; if that fails, the old one still works.'
        : err.message, 'bad');
    } finally {
      el('save').disabled = false;
    }
  });
})();
</script>
</body>
</html>
