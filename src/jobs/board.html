<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jobs</title>
<script>
  // Theme before first paint; same key and rule as the Planner's header.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('app.theme'); } catch (e) { /* storage blocked */ }
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/planner.css">
<style>
  .drop { border: 2px dashed var(--line, #999); border-radius: 8px; padding: 1.25rem; text-align: center; margin-bottom: 1rem; }
  .drop.over { background: var(--hover, rgba(0, 0, 0, .05)); }
  .not-tracked { font-style: italic; }
  details.print { position: relative; }
  .mark-bar { display: flex; gap: .5rem; align-items: center; margin: .5rem 0; }
  details.print > div { position: absolute; right: 0; z-index: 1; background: var(--bg, #fff); border: 1px solid var(--line, #999); border-radius: 6px; padding: .4rem .6rem; white-space: nowrap; }
</style>
</head>
<body>
<!--
  board.html — Jobs (#97): drop one job's material sheet, see what it would save, then commit it, or
  Deduct directly (#100); and the Job board, one row per job, with a Print menu for a job with a lumber
  pull list (#99), Built and Shipped on each row, and check boxes to mark several jobs at once (#100, J68);
  Cancel job, Un-build and Un-ship on each row, one job at a time, after a confirmation (#101, J86, J87).
  The board sorts by any column, searches job number or name, filters by status and family; a job's row
  opens its job view below it: a tab per family, History, and its delivery date to edit (#102).

  Glue, NOT UNIT-TESTED: the drop area and the table need a browser, and this
  repo has no DOM harness. Reading the sheet, matching its lines, the refusals
  and the board's rows are tested over HTTP in test/jobs.test.js; the page is
  checked by hand on Preview (#96, Testing Decisions). What marking consumes,
  and marking itself, are tested over HTTP and in the database; so are what
  an undo gives back and the undo itself. The board's filter is
  PlannerUI.boardJobs and the job view's tabs PlannerUI.jobTabs, both
  tested in test/planner-ui.test.js; the view's data and the
  delivery date save over HTTP and in the database.
-->
<header class="appbar">
  <div class="appbar-primary">
    <span class="appbar-brand">RTW Inventory Tracker</span>
    <button type="button" class="themebtn" id="theme-btn" aria-label="Switch between light and dark">☾</button>
    <span class="appbar-user" id="user-name"></span>
    <button type="button" class="ghost appbar-signout" id="sign-out">Sign out</button>
  </div>
  <nav class="appbar-nav" aria-label="Modes"><a href="/">Planner</a><a href="/jobs" class="here" aria-current="page">Jobs</a><a href="/inventory">Inventory</a><a href="/settings/users">Settings</a><a href="/activity">Activity Log</a></nav>
  <div class="appbar-filter">
    <span class="label" id="family-label">Family</span>
    <div class="seg" id="family-filter" role="group" aria-labelledby="family-label"><button type="button" class="placeholder" tabindex="-1" aria-hidden="true">All</button></div>
    <span class="label" id="status-label">Status</span>
    <div class="seg" id="status-filter" role="group" aria-labelledby="status-label"></div>
    <label class="label">Search <input id="search" type="search" placeholder="Job number or name"></label>
  </div>
</header>

<div class="wrap">
  <label class="drop" id="drop">
    Drop a job's material sheet here, or click to choose it.
    <input type="file" id="file" accept=".csv,text/csv" hidden>
    <div class="sub">Plates, hangers, lumber and LVL are committed now. EWP: step 5.</div>
  </label>
  <div id="message" role="status"></div>
  <div id="sheet-view"></div>
  <div id="confirm"></div>
  <div class="mark-bar" id="mark-bar" hidden>
    <span id="selected"></span>
    <button type="button" data-mark="built">Mark built</button>
    <button type="button" data-mark="shipped">Mark shipped</button>
  </div>
  <table class="log">
    <thead id="head"></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="/app-header.js"></script>
<script src="/planner-ui.js"></script>
<script>
(async () => {
  const { esc, flagsHtml, sortRows, sortIcon, wireSort, jobTabs, boardJobs, renderBreakdown } = PlannerUI;
  const { say, send, getAll, askTiming, showTime, showDate, showDay } = AppHeader;
  const el = (id) => document.getElementById(id);
  if (!await AppHeader.me) return;

  // A delivery date as the board shows it, or — for none.
  const dayText = (d) => esc(showDay(d));

  // A family not live in Inventory is kept on the job, not tracked yet (J4).
  const familyText = (f) => (f.live ? esc(f.name) : '<span class="not-tracked">' + esc(f.name) + ' (not tracked yet)</span>');

  // What each job can be marked, as the server says (story 18; #96, "Database rules").
  const canMark = { built: (j) => j.can_build, shipped: (j) => j.can_ship };
  const markButton = (to, j) => (canMark[to](j)
    ? '<button type="button" class="ghost" data-mark="' + to + '" data-number="' + esc(j.number) + '">' + (to === 'built' ? 'Built' : 'Shipped') + '</button> '
    : '');

  // What each job can undo, as the server says (#101): the row's button,
  // the confirmation's words, and its buttons: the row's label and `no` (J87).
  const UNDO = {
    cancel: { can: (j) => j.can_cancel, label: 'Cancel job', title: 'Cancel', back: 'Returns to available', no: 'Keep job',
      note: 'This is final.' },
    unbuild: { can: (j) => j.can_unbuild, label: 'Un-build', title: 'Un-build', back: 'Back to on hand', no: 'Close' },
    unship: { can: (j) => j.can_unship, label: 'Un-ship', title: 'Un-ship', back: 'Back to on hand', no: 'Close' },
  };
  const undoButtons = (j) => Object.entries(UNDO).filter(([, u]) => u.can(j)).map(([action, u]) =>
    '<button type="button" class="ghost" data-undo="' + action + '" data-number="' + esc(j.number) + '">' + u.label + '</button> ').join('');

  // The board as last loaded, by job number, for its versions, in the
  // server's order (last changed first); the families for the family bar.
  let jobs = new Map();
  let families = [];
  // What the board shows (#102, stories 37–39): open jobs first (committed
  // or built), the family bar's choice, the search, and the sort.
  const STATUSES = { open: { label: 'Open', has: ['committed', 'built'] }, shipped: { label: 'Shipped', has: ['shipped'] },
    cancelled: { label: 'Cancelled', has: ['cancelled'] }, all: { label: 'All', has: null } };
  let status = 'open';
  let family = 'all';
  const sort = { col: null, dir: 'asc' };
  // Status sorts in the job's lifecycle; a job with no delivery date sorts
  // after every dated job.
  const LIFECYCLE = ['committed', 'built', 'shipped', 'cancelled'];
  const NO_DATE = '9999-12-31';
  const COLUMNS = [
    ['num', 'Job', (j) => j.number], ['name', 'Name', (j) => j.name], ['families', 'Families', (j) => j.families.map((f) => f.name).join(', ')],
    ['status', 'Status', (j) => LIFECYCLE.indexOf(j.status)], ['delivery', 'Delivery', (j) => j.delivery_date || NO_DATE],
    ['changed', 'Last changed (Eastern)', (j) => j.changed_at],
  ];
  // The job open below its row: its view as last loaded, the tab shown, and
  // a date typed but not saved (`draft`). The jobs selected, by number, kept
  // across searches and filters until marked.
  let opened = null;
  const picked = new Set();

  el('status-filter').innerHTML = Object.entries(STATUSES).map(([code, s]) =>
    '<button type="button" data-status="' + code + '" aria-pressed="' + (code === status) + '">' + s.label + '</button>').join('');
  el('status-filter').addEventListener('click', (e) => {
    const b = e.target.closest('[data-status]');
    if (!b) return;
    status = b.dataset.status;
    for (const x of el('status-filter').children) x.setAttribute('aria-pressed', String(x === b));
    paint();
  });
  el('search').addEventListener('input', () => paint());

  // The open job's view is read again with the board, so its History
  // shows what was just saved.
  async function loadBoard() {
    const [body, view] = (await getAll(['/api/jobs', ...(opened ? ['/api/jobs/view?' + new URLSearchParams({ number: opened.number })] : [])])) ?? [];
    if (!body) return;
    jobs = new Map(body.jobs.map((j) => [j.number, j]));
    if (!families.length) {
      families = body.families;
      AppHeader.familyBar(families.map((f) => ({ code: f.code, label: f.name })), (f) => { family = f; paint(); });
    }
    for (const n of picked) if (!jobs.has(n) || !canMark.shipped(jobs.get(n))) picked.delete(n);
    if (opened) opened = jobs.has(opened.number) && view ? { ...opened, view, draft: undefined } : null;
    paint();
  }

  function paint() {
    el('head').innerHTML = '<tr><th><input type="checkbox" id="select-all" aria-label="Select every job"></th>' +
      COLUMNS.map(([col, label]) => '<th class="sortable" data-jobsort="' + col + '">' + esc(label) + ' ' + sortIcon(sort.col === col, sort.dir) + '</th>').join('') +
      '<th></th></tr>';
    wireSort(el('head').closest('table'), 'jobsort', sort, paint);
    const shown = boardJobs([...jobs.values()], { statuses: STATUSES[status].has, family, search: el('search').value });
    const rows = sortRows(shown, sort, Object.fromEntries(COLUMNS.map(([col, , get]) => [col, get])));
    el('rows').innerHTML = rows.map((j) => '<tr><td>' +
      (canMark.shipped(j) ? '<input type="checkbox" class="select" value="' + esc(j.number) + '"' + (picked.has(j.number) ? ' checked' : '') + ' aria-label="Select job ' + esc(j.number) + '">' : '') +
      '</td><td><button type="button" class="ghost" data-open="' + esc(j.number) + '" aria-expanded="' + (opened?.number === j.number) + '">' +
      (opened?.number === j.number ? '▾ ' : '▸ ') + esc(j.number) + '</button></td><td>' + esc(j.name || '') + '</td><td>' +
      j.families.map(familyText).join(', ') + '</td><td>' + esc(j.status) + '</td><td>' +
      dayText(j.delivery_date) + '</td><td>' +
      esc(showTime(j.changed_at)) + ' · ' + esc(j.changed_by) + '</td><td>' + markButton('built', j) + markButton('shipped', j) + undoButtons(j) + (j.pull_list
        ? '<details class="print"><summary>Print</summary><div><a target="_blank" href="' +
          esc('/api/jobs/pull-list?' + new URLSearchParams({ number: j.number })) + '">Lumber pull list</a></div></details>'
        : '') + '</td></tr>' +
      (opened?.number === j.number ? '<tr class="jobs"><td colspan="8">' + viewHtml() + '</td></tr>' : '')).join('')
      || '<tr><td colspan="8" class="sub">' + (jobs.size ? 'No jobs match.' : 'No jobs yet.') + '</td></tr>';
    showSelected();
  }

  // One job's view (#102): its delivery date, to edit unless it is
  // cancelled (J103); a tab per family on the job (PlannerUI.jobTabs), and
  // History, who did what and when (story 43).
  async function loadView(number) {
    const [body] = (await getAll(['/api/jobs/view?' + new URLSearchParams({ number })])) ?? [];
    if (body) opened = { tab: opened?.number === number ? opened.tab : null, number, view: body };
  }

  function viewHtml() {
    const { job, history } = opened.view;
    const { tabs, open } = jobTabs({ number: job.number, lines: opened.view.lines }, families, family);
    const tab = tabs.some((t) => t.family === opened.tab) || opened.tab === 'history' ? opened.tab : open || 'history';
    const tabButton = (code, label) => '<button type="button" data-tab="' + code + '" aria-pressed="' + (code === tab) + '">' + esc(label) + '</button>';
    const body = renderBreakdown(tab === 'history'
      ? [{ heading: 'History — newest first', columns: [{ label: 'When (Eastern)' }, { label: 'Who' }, { label: 'Action' }, { label: 'Change' }],
        rows: history.map((h) => [showTime(h.at), h.by, h.action, h.change]) }]
      : tabs.find((t) => t.family === tab).tables);
    return '<div class="drill"><p>Delivery ' + dayText(job.delivery_date) +
      (job.delivery_date_edited ? ' (changed by hand)' : '') +
      (job.can_set_date ? ' <input type="date" id="date" value="' + esc(opened.draft ?? job.delivery_date ?? '') + '" aria-label="New delivery date"> ' +
        '<button type="button" class="ghost" id="save-date">Save date</button>' : '') + '</p>' +
      '<div class="seg" role="group" aria-label="Job view">' + tabs.map((t) => tabButton(t.family, t.label)).join('') + tabButton('history', 'History') + '</div>' +
      '<div style="margin-top:10px">' + body + '</div></div>';
  }

  async function toggleJob(number) {
    if (opened?.number === number) opened = null;
    else await loadView(number);
    paint();
  }

  // One request, built once with its retry key, as for marking. A blank
  // date clears it. A refusal shows the job as it is now.
  async function saveDate(request) {
    say('');
    try {
      const { job } = await send('/api/jobs/delivery-date', request);
      say('Job ' + job.number + ' delivery date saved.', 'ok');
      loadBoard();
    } catch (err) {
      say(err.message, 'bad', err.unconfirmed ? () => saveDate(request) : null);
      if (!err.unconfirmed) loadBoard();
    }
  }

  const selected = () => [...picked];
  function showSelected() {
    const n = picked.size;
    el('mark-bar').hidden = !n;
    el('selected').textContent = n + (n === 1 ? ' job selected' : ' jobs selected');
  }
  const pick = (box) => (box.checked ? picked.add(box.value) : picked.delete(box.value));
  el('rows').addEventListener('change', (e) => {
    if (e.target.classList.contains('select')) pick(e.target);
    showSelected();
  });
  el('rows').addEventListener('input', (e) => {
    // A part-typed date reads as blank; keep no draft of it, or a repaint
    // would turn it into a valid blank that clears the date.
    if (e.target.id === 'date') opened.draft = e.target.validity.badInput ? undefined : e.target.value;
  });
  el('head').addEventListener('change', (e) => {
    if (e.target.id !== 'select-all') return;
    for (const t of document.querySelectorAll('.select')) { t.checked = e.target.checked; pick(t); }
    showSelected();
  });

  // One confirmation for every job marked (story 20): what each consumes,
  // a family not live listed as not tracked yet (J4). Nothing is saved
  // until the person confirms.
  async function confirmMark(to, numbers) {
    say('');
    const refused = numbers.find((n) => !canMark[to](jobs.get(n)));
    if (refused) {
      const hidden = !document.querySelector('.select[value="' + CSS.escape(refused) + '"]');
      say('Job ' + refused + ' cannot be marked ' + to + '. Clear its box, then try again.' +
        (hidden ? ' It is hidden by the search or a filter.' : ''), 'bad');
      return;
    }
    const query = new URLSearchParams([['to', to], ...numbers.map((n) => ['number', n])]);
    const [body] = (await getAll(['/api/jobs/to-consume?' + query])) ?? [];
    if (!body) return;
    const lineText = (l) => esc(l.quantity) + ' × ' + esc(l.item) + (l.live ? '' : ' <span class="not-tracked">(' + esc(l.family) + ', not tracked yet)</span>');
    el('confirm').innerHTML = '<h2>Mark ' + (numbers.length === 1 ? 'job ' + esc(numbers[0]) : numbers.length + ' jobs') + ' ' + to + '?</h2><ul>' +
      body.jobs.map((j) => '<li><b>Job ' + esc(j.number) + '</b>' + (j.name ? ' · ' + esc(j.name) : '') + ': ' +
        (j.lines.length ? j.lines.map(lineText).join(', ') : 'nothing left to consume') + '</li>').join('') + '</ul><p>' +
      '<button type="button" id="confirm-mark">Mark ' + to + '</button> <button type="button" class="ghost" id="cancel-mark">Cancel</button></p>';
    el('confirm-mark').addEventListener('click', () => mark({
      key: crypto.randomUUID(), to, jobs: numbers.map((n) => ({ number: n, version: jobs.get(n).version })),
    }));
    el('cancel-mark').addEventListener('click', () => { el('confirm').innerHTML = ''; });
  }

  // One request, built once with its retry key, so "Try again" after an
  // unconfirmed save sends the very same one and acts once. A save near a
  // count asks "before or after the count?" first (story 21).
  async function mark(request) {
    say('');
    try {
      const { jobs: marked } = await send('/api/jobs/mark', request);
      el('confirm').innerHTML = '';
      picked.clear();
      say((marked.length === 1 ? 'Job ' + marked[0].number : marked.length + ' jobs') + ' marked ' + request.to + '.', 'ok');
      loadBoard();
    } catch (err) {
      if (askTiming(err, (timing) => mark({ ...request, timing }))) return;
      say(err.message, 'bad', err.unconfirmed ? () => mark(request) : null);
    }
  }

  // Cancel, Un-build or Un-ship one job (J86) after a confirmation that
  // lists what comes back and where the job goes (J87). Nothing is saved
  // until the person confirms.
  async function confirmUndo(action, number) {
    say('');
    const u = UNDO[action];
    const query = new URLSearchParams({ action, number });
    const [body] = (await getAll(['/api/jobs/to-give-back?' + query])) ?? [];
    if (!body) return;
    el('confirm').innerHTML = '<h2>' + u.title + ' job ' + esc(body.number) + (body.name ? ' · ' + esc(body.name) : '') + '?</h2><p>' +
      u.back + ': ' + (body.lines.length ? body.lines.map((l) => esc(l.quantity) + ' × ' + esc(l.item)).join(', ') : 'nothing') + '.</p><p>' +
      (u.note ? '<b>' + u.note + '</b>' : 'The job goes back to ' + esc(body.to) + '.') + '</p><p>' +
      '<button type="button" id="confirm-undo">' + u.label + '</button> <button type="button" class="ghost" id="keep-job">' + u.no + '</button></p>';
    el('confirm-undo').addEventListener('click', () => undo({ key: crypto.randomUUID(), action, number, version: jobs.get(number).version }));
    el('keep-job').addEventListener('click', () => { el('confirm').innerHTML = ''; });
  }

  // One request, built once with its retry key, as for marking.
  async function undo(request) {
    say('');
    try {
      const { job } = await send('/api/jobs/undo', request);
      el('confirm').innerHTML = '';
      say('Job ' + job.number + (job.status === 'cancelled' ? ' cancelled.' : ' is ' + job.status + ' again.'), 'ok');
      loadBoard();
    } catch (err) {
      say(err.message, 'bad', err.unconfirmed ? () => undo(request) : null);
    }
  }

  document.addEventListener('click', (e) => {
    const button = e.target.closest('[data-mark]');
    if (button) confirmMark(button.dataset.mark, button.dataset.number ? [button.dataset.number] : selected());
    const undoing = e.target.closest('[data-undo]');
    if (undoing) confirmUndo(undoing.dataset.undo, undoing.dataset.number);
    const opening = e.target.closest('[data-open]');
    if (opening) toggleJob(opening.dataset.open);
    const tab = e.target.closest('[data-tab]');
    if (tab) { opened.tab = tab.dataset.tab; paint(); }
    if (e.target.id === 'save-date') {
      if (el('date').validity.badInput) say('Type the whole date. To remove the date, clear the box.', 'bad');
      else saveDate({ key: crypto.randomUUID(), number: opened.number, version: opened.view.job.version, delivery_date: el('date').value });
    }
  });

  // The sheet last dropped, checked before it is committed (J27), and the
  // version of its job when the check found it committed: a revised
  // sheet's save sends it (#120).
  let sheet = null;
  let version;
  // The lines on screen, each with its catalog flag (J8), so a fix button finds its line.
  let shownLines = [];

  function showLines(lines, intro) {
    shownLines = lines;
    el('sheet-view').innerHTML = !lines.length ? '' : intro + '<table class="log"><thead><tr><th>Family</th><th>Sheet line</th><th>Quantity</th><th></th></tr></thead><tbody>' +
      lines.map((l, i) => '<tr><td>' + esc(l.family) + '</td><td>' + esc(l.sku) + (l.lf ? ' · ' + esc(l.lf) + ' LF' : '') + '</td><td>' + esc(l.quantity) + '</td><td>' +
        flagsHtml(l.flag, String(i), l.family) + '</td></tr>').join('') + '</tbody></table>';
  }

  // A revised sheet's change screen (#120, story 28): each line added,
  // removed or changed against the job's current revision.
  function changesHtml(changes) {
    const amount = (n) => (n === null ? '—' : esc(n));
    return '<h3>What changed</h3>' + (!changes.length ? '<p class="sub">No line changed.</p>'
      : '<table class="log"><thead><tr><th>Family</th><th>Line</th><th>Was</th><th>Now</th><th></th></tr></thead><tbody>' +
        changes.map((c) => '<tr><td>' + esc(c.family) + '</td><td>' + esc(c.sku) + '</td><td>' + amount(c.was) + '</td><td>' + amount(c.now) +
          '</td><td>' + (c.was === null ? 'added' : c.now === null ? 'removed' : 'changed') + '</td></tr>').join('') + '</tbody></table>') +
      '<h3>The revised sheet</h3>';
  }

  // Which delivery date to keep, when the revised sheet's is not the job's
  // (story 34, J137): the job's own is chosen when a person set it by hand.
  function dateChoiceHtml(choice, sheetDate) {
    if (!choice) return '';
    const byHand = choice.set_by !== null;
    return '<p>Which delivery date should the job keep?<br>' +
      '<label><input type="radio" name="keep-date" value="true"' + (byHand ? ' checked' : '') + '> The job\'s date, ' + dayText(choice.current) +
      (byHand ? ' (set by hand by ' + esc(choice.set_by) + ' on ' + esc(showDate(choice.set_at)) + ')' : '') + '</label><br>' +
      '<label><input type="radio" name="keep-date" value="false"' + (byHand ? '' : ' checked') + '> The sheet\'s date, ' + dayText(sheetDate) + '</label></p>';
  }

  // Shows what committing the sheet would save, with a Commit job button.
  // Nothing is saved until the person clicks it.
  async function check() {
    say('');
    showLines([], '');
    let body;
    try {
      body = await send('/api/jobs/check', { file: sheet });
    } catch (err) {
      say(err.unconfirmed ? 'The sheet could not be checked. Drop it again.' : err.message, 'bad');
      return;
    }
    const { job, lines, lvl_by_depth: depths, warnings } = body;
    version = job.version;
    const flagged = lines.filter((l) => l.flag).length;
    const revising = job.unchanged === false;
    showLines(lines, '<h2>Job ' + esc(job.number) + (job.name ? ' · ' + esc(job.name) : '') + '</h2><p class="sub">Delivery ' +
      dayText(job.delivery_date) + '. ' +
      (revising ? 'This is a revised sheet for a job already in the app. Saving it replaces the job\'s lines. '
        : job.status ? 'This job is already in the app (' + esc(job.status) + '). ' : '') +
      (warnings.length ? 'Notes from the sheet: ' + esc(warnings.join(' ')) : '') + '</p>' +
      (depths.length ? '<p class="sub">LVL by depth: ' + depths.map((d) => esc(d.label) + ' ' + esc(d.lf) + ' LF').join(', ') + '</p>' : '') +
      (revising ? changesHtml(body.changes) + dateChoiceHtml(body.date_choice, job.delivery_date) : '') + '<p>' +
      '<button type="button" id="commit-job"' + (flagged ? ' disabled' : '') + '>' + (revising ? 'Save revision' : 'Commit job') + '</button> ' +
      (revising ? '' : '<button type="button" class="ghost" id="deduct-job"' + (flagged ? ' disabled' : '') + '>Deduct directly (already shipped)</button> ') +
      '<button type="button" class="ghost" id="clear-job">Clear</button>' +
      (flagged ? ' <span class="sub">Fix the flagged ' + (flagged === 1 ? 'line' : 'lines') + ' first.</span>' : '') + '</p>');
  }

  // One request, built once with its retry key, so "Try again" after an
  // unconfirmed save sends the very same one and acts once.
  // Deduct directly (story 19) sends the same request to its own route, and
  // near a count asks "before or after the count?" first.
  async function commit(request, route = '/api/jobs/commit') {
    say('');
    try {
      const { job } = await send(route, request);
      showLines([], '');
      say(job.unchanged ? 'Job ' + job.number + ' is already committed from this sheet; nothing changed.'
        : job.revision > 1 ? 'Job ' + job.number + ' revised: revision ' + job.revision + ' saved.'
        : 'Job ' + job.number + (job.status === 'shipped' ? ' committed and marked shipped.' : ' committed.'), 'ok');
      loadBoard();
    } catch (err) {
      if (askTiming(err, (timing) => commit({ ...request, timing }, route))) return;
      say(err.message, 'bad', err.unconfirmed ? () => commit(request, route) : null);
      if (err.reply?.lines) showLines(err.reply.lines, '');
    }
  }

  // Fixes a line's catalog flag (PlannerUI.flagFixes), then checks the sheet
  // again. A save that was not confirmed offers "Try again", which resends
  // only the saves still to do, each with its own retry key.
  async function fixAll(requests) {
    try {
      while (requests.length) {
        await send(...requests[0]);
        requests = requests.slice(1);
      }
    } catch (err) {
      say(err.message, 'bad', err.unconfirmed ? () => fixAll(requests) : null);
      return;
    }
    if (sheet) check();
  }
  el('sheet-view').addEventListener('click', (e) => {
    if (e.target.id === 'commit-job') {
      const keep = document.querySelector('input[name="keep-date"]:checked');
      commit({ key: crypto.randomUUID(), file: sheet, version, keep_date: keep ? keep.value === 'true' : undefined });
    }
    if (e.target.id === 'deduct-job') commit({ key: crypto.randomUUID(), file: sheet }, '/api/jobs/deduct');
    if (e.target.id === 'clear-job') { sheet = null; version = undefined; say(''); showLines([], ''); }
    const button = e.target.closest('[data-flag-do]');
    if (button) fixAll(PlannerUI.flagFixes(button.dataset.flagDo, shownLines[Number(button.dataset.flagKey)].flag));
  });

  async function take(file) {
    if (!file) return;
    sheet = { name: file.name, text: await file.text() };
    check();
  }
  el('file').addEventListener('change', (e) => { take(e.target.files[0]); e.target.value = ''; });
  const drop = el('drop');
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); take(e.dataTransfer.files[0]); });

  loadBoard();
})();
</script>
</body>
</html>
